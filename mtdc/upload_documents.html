<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother Theresa Degree College - Upload Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        marquee {
            background: #0b4ea2;
            color: white;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header {
            background: linear-gradient(135deg, #0b4ea2, #1e88e5);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 28px;
        }

        .header .staff-info {
            text-align: right;
            font-size: 14px;
        }

        .header .staff-info span {
            display: block;
            margin: 5px 0;
        }

        .content {
            padding: 30px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #0b4ea2;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            background: #e3f2fd;
            border-color: #1e88e5;
        }

        .upload-section i {
            font-size: 60px;
            color: #0b4ea2;
            margin-bottom: 15px;
        }

        .upload-section h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .upload-section p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0b4ea2;
            box-shadow: 0 0 5px rgba(11, 78, 162, 0.3);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #0b4ea2;
            color: white;
        }

        .btn-primary:hover {
            background: #093d82;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .documents-list {
            margin-top: 30px;
        }

        .documents-list h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0b4ea2;
        }

        .document-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .document-card .doc-info {
            flex: 1;
        }

        .document-card .doc-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .document-card .doc-meta {
            font-size: 12px;
            color: #666;
        }

        .doc-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
            margin-top: 3px;
        }

        .doc-status.approved { background: #d4edda; color: #155724; }
        .doc-status.pending { background: #fff3cd; color: #856404; }
        .doc-status.rejected { background: #f8d7da; color: #721c24; }

        .document-card .doc-actions {
            display: flex;
            gap: 10px;
        }

        .document-card .doc-actions button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-view {
            background: #17a2b8;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state i {
            font-size: 50px;
            color: #ddd;
            margin-bottom: 15px;
        }

        .bottom-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }

        .success {
            color: #28a745;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header .staff-info {
                text-align: center;
                margin-top: 10px;
            }
            .document-card {
                flex-direction: column;
                text-align: center;
            }
            .document-card .doc-actions {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <marquee behavior="scroll" direction="left" scrollamount="10">
            MOTHER THERESA DEGREE COLLEGE
        </marquee>

        <div class="header">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> Upload Documents</h2>
            <div class="staff-info">
                <span><strong>Welcome:</strong> <span id="staffName">Staff</span></span>
                <span><strong>Email:</strong> <span id="staffEmail">staff@mtc.edu</span></span>
                <button onclick="logout()" style="margin-top:10px; padding:8px 15px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>

        <div class="content">
            <!-- Upload Form -->
            <div class="upload-section" id="dropZone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <h3>Upload Your Documents</h3>
                <p>Supported formats: PDF, JPG, PNG, DOC, DOCX, XLS, XLSX (Max 100MB)</p>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="documentName">Document Name *</label>
                    <input type="text" id="documentName" placeholder="e.g., Resume, Certificate, ID Proof" required>
                </div>

                <div class="form-group">
                    <label for="documentType">Document Type *</label>
                    <select id="documentType" required>
                        <option value="">Select Document Type</option>
                        <option value="Resume">Resume / CV</option>
                        <option value="ID Proof">ID Proof (Aadhar/PAN/Passport)</option>
                        <option value="Certificate">Educational Certificate</option>
                        <option value="Experience Certificate">Experience Certificate</option>
                        <option value="Salary Slip">Salary Slip</option>
                        <option value="Offer Letter">Offer Letter</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="documentFile">Select File *</label>
                    <input type="file" id="documentFile" accept=".pdf,.jpg,.jpeg,.png,.gif,.doc,.docx,.xls,.xlsx" required>
                    <small id="fileInfo" class="success"></small>
                    <small id="fileError" class="error"></small>
                </div>

                <div class="bottom-buttons">
                    <button type="submit" class="btn btn-primary" id="uploadBtn">
                        <i class="fa-solid fa-upload"></i> Upload Document
                    </button>
                    <button type="button" class="btn btn-success" onclick="window.location.href='staff_dashboard.html'">
                        <i class="fa-solid fa-home"></i> Go to Dashboard
                    </button>
                </div>
            </form>

            <!-- Documents List -->
            <div class="documents-list">
                <h3><i class="fa-solid fa-folder-open"></i> Your Documents</h3>
                <div id="documentsContainer">
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>No documents uploaded yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check staff login
        document.addEventListener('DOMContentLoaded', function() {
            var loggedIn = localStorage.getItem('mtcLoggedIn');
            var userType = localStorage.getItem('mtcUserType');
            var userName = localStorage.getItem('mtcUserName');
            var userEmail = localStorage.getItem('mtcUserEmail');

            if (!loggedIn || userType !== 'staff') {
                alert('Please login as staff first');
                window.location.href = 'stafflogin.html';
                return;
            }

            document.getElementById('staffName').textContent = userName || 'Staff';
            document.getElementById('staffEmail').textContent = userEmail || 'staff@mtc.edu';

            loadDocuments();
        });

        // File input change
        document.getElementById('documentFile').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                if (file.size > 100 * 1024 * 1024) {
                    document.getElementById('fileError').textContent = 'File size must be less than 100MB';
                    document.getElementById('fileInfo').textContent = '';
                    this.value = '';
                } else {
                    var sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    document.getElementById('fileInfo').textContent = 'Selected: ' + file.name + ' (' + sizeMB + ' MB)';
                    document.getElementById('fileError').textContent = '';
                }
            }
        });

        // Form submit
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var documentName = document.getElementById('documentName').value;
            var documentType = document.getElementById('documentType').value;
            var documentFile = document.getElementById('documentFile').files[0];

            if (!documentName || !documentType || !documentFile) {
                alert('Please fill all fields');
                return;
            }

            var formData = new FormData();
            formData.append('document_name', documentName);
            formData.append('document_type', documentType);
            formData.append('document', documentFile);

            var uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            uploadBtn.disabled = true;

            fetch('includes/upload_documents.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                uploadBtn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload Document';
                uploadBtn.disabled = false;

                if (data.success) {
                    alert('Document uploaded successfully!');
                    document.getElementById('uploadForm').reset();
                    document.getElementById('fileInfo').textContent = '';
                    loadDocuments();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                uploadBtn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload Document';
                uploadBtn.disabled = false;
                alert('Error uploading document');
            });
        });

        // Load documents
        function loadDocuments() {
            fetch('includes/upload_documents.php?action=list')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayDocuments(data.documents);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // Display documents
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function displayDocuments(documents) {
            var container = document.getElementById('documentsContainer');

            if (documents.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>No documents uploaded yet</p></div>';
                return;
            }

            var html = '';
            documents.forEach(function(doc) {
                var sizeMB = (doc.file_size / (1024 * 1024)).toFixed(2);
                var date = new Date(doc.uploaded_at).toLocaleDateString('en-IN');

                html += '<div class="document-card">' +
                    '<div class="doc-info">' +
                    '<div class="doc-name"><i class="fa-solid fa-file"></i> ' + esc(doc.document_name) + '</div>' +
                    '<div class="doc-meta">Type: ' + esc(doc.document_type) + ' | Size: ' + sizeMB + ' MB | Uploaded: ' + date + '</div>' +
                    '<div class="doc-meta"><span class="doc-status ' + esc(doc.status) + '">' + esc(doc.status) + '</span></div>' +
                    '</div>' +
                    '<div class="doc-actions">' +
                    '<button class="btn-view" onclick="viewDocument(\'' + esc(doc.file_path) + '\')"><i class="fa-solid fa-eye"></i> View</button>' +
                    '<button class="btn-delete" onclick="deleteDocument(' + doc.id + ')"><i class="fa-solid fa-trash"></i> Delete</button>' +
                    '</div>' +
                    '</div>';
            });

            container.innerHTML = html;
        }

        // View document
        function viewDocument(filePath) {
            window.open(filePath, '_blank');
        }

        // Delete document
        function deleteDocument(docId) {
            if (!confirm('Are you sure you want to delete this document?')) {
                return;
            }

            var formData = new FormData();
            formData.append('action', 'delete');
            formData.append('document_id', docId);

            fetch('includes/upload_documents.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Document deleted successfully');
                    loadDocuments();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error deleting document');
            });
        }

        // Logout
        function logout() {
            fetch('includes/logout.php', { method: 'POST', keepalive: true });
            localStorage.removeItem('mtcLoggedIn');
            localStorage.removeItem('mtcUserType');
            localStorage.removeItem('mtcUserName');
            localStorage.removeItem('mtcUserEmail');
            window.location.href = 'stafflogin.html';
        }
    </script>
</body>
</html>

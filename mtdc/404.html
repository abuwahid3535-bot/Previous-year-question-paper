<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { text-align: center; color: white; padding: 40px; }
        .box .code { font-size: 96px; font-weight: 700; line-height: 1; }
        .box h1 { font-size: 26px; margin: 15px 0 8px; }
        .box p { font-size: 15px; opacity: 0.9; margin-bottom: 25px; }
        .box a { display: inline-block; background: white; color: #1a5276; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .box a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother Theresa Degree College - Manage Question Papers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        marquee {
            background: #0b4ea2;
            color: white;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header {
            background: linear-gradient(135deg, #0b4ea2, #1e88e5);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 28px;
        }

        .header .staff-info {
            text-align: right;
            font-size: 14px;
        }

        .header .staff-info span {
            display: block;
            margin: 5px 0;
        }

        .content {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0b4ea2;
            box-shadow: 0 0 5px rgba(11, 78, 162, 0.3);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #0b4ea2;
            color: white;
        }

        .btn-primary:hover {
            background: #093d82;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .bottom-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .papers-list {
            margin-top: 30px;
        }

        .papers-list h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0b4ea2;
        }

        .paper-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .paper-card .paper-info {
            flex: 1;
        }

        .paper-card .paper-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .paper-card .paper-meta {
            font-size: 12px;
            color: #666;
        }

        .paper-card .paper-actions {
            display: flex;
            gap: 10px;
        }

        .paper-card .paper-actions button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-view {
            background: #17a2b8;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state i {
            font-size: 50px;
            color: #ddd;
            margin-bottom: 15px;
        }

        .success { color: #28a745; font-size: 12px; margin-top: 5px; display: block; }
        .error { color: #dc3545; font-size: 12px; margin-top: 5px; display: block; }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header .staff-info {
                text-align: center;
                margin-top: 10px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .paper-card {
                flex-direction: column;
                text-align: center;
            }
            .paper-card .paper-actions {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <marquee behavior="scroll" direction="left" scrollamount="10">
            MOTHER THERESA DEGREE COLLEGE
        </marquee>

        <div class="header">
            <h2><i class="fa-solid fa-file-pdf"></i> Manage Question Papers</h2>
            <div class="staff-info">
                <span><strong>Welcome:</strong> <span id="staffName">Staff</span></span>
                <span><strong>Email:</strong> <span id="staffEmail">staff@mtc.edu</span></span>
                <button onclick="logout()" style="margin-top:10px; padding:8px 15px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>

        <div class="content">
            <!-- Upload Form -->
            <form id="uploadForm">
                <h3 style="color:#333; margin-bottom:15px;"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Question Paper</h3>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="paperTitle">Subject / Paper Title *</label>
                        <input type="text" id="paperTitle" placeholder="e.g., Database Management Systems" required>
                    </div>

                    <div class="form-group">
                        <label for="paperCourse">Course *</label>
                        <select id="paperCourse" required>
                            <option value="">Select Course</option>
                            <option value="bcom">B.Com</option>
                            <option value="bsc">B.Sc</option>
                            <option value="bca">BCA</option>
                            <option value="bba">BBA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="paperSemester">Semester *</label>
                        <select id="paperSemester" required>
                            <option value="">Select Semester</option>
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                            <option value="5">5th Semester</option>
                            <option value="6">6th Semester</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="paperYear">Examination Year *</label>
                        <select id="paperYear" required>
                            <option value="">Select Year</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                        </select>
                    </div>

                    <div class="form-group" style="grid-column:1/-1;">
                        <label for="paperFile">PDF File *</label>
                        <input type="file" id="paperFile" accept=".pdf" required>
                        <small id="fileInfo" class="success"></small>
                    </div>
                </div>

                <div class="bottom-buttons">
                    <button type="submit" class="btn btn-primary" id="uploadBtn">
                        <i class="fa-solid fa-upload"></i> Upload Paper
                    </button>
                    <button type="button" class="btn btn-success" onclick="window.location.href='staff_dashboard.html'">
                        <i class="fa-solid fa-home"></i> Go to Dashboard
                    </button>
                </div>
            </form>

            <!-- Papers List -->
            <div class="papers-list">
                <h3><i class="fa-solid fa-folder-open"></i> Uploaded Question Papers</h3>
                <div id="papersContainer">
                    <div class="empty-state">
                        <i class="fa-solid fa-file-pdf"></i>
                        <p>No question papers uploaded</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var loggedIn = localStorage.getItem('mtcLoggedIn');
            var userType = localStorage.getItem('mtcUserType');
            var userName = localStorage.getItem('mtcUserName');
            var userEmail = localStorage.getItem('mtcUserEmail');

            if (!loggedIn || userType !== 'staff') {
                alert('Please login as staff first');
                window.location.href = 'stafflogin.html';
                return;
            }

            document.getElementById('staffName').textContent = userName || 'Staff';
            document.getElementById('staffEmail').textContent = userEmail || 'staff@mtc.edu';

            loadPapers();
        });

        document.getElementById('paperFile').addEventListener('change', function(e) {
            var file = e.target.files[0];
            var info = document.getElementById('fileInfo');
            if (file) {
                if (file.size > 100 * 1024 * 1024) {
                    info.textContent = 'File size must be less than 100MB';
                    info.className = 'error';
                    this.value = '';
                } else {
                    var sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    info.textContent = 'Selected: ' + file.name + ' (' + sizeMB + ' MB)';
                    info.className = 'success';
                }
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('paperTitle').value;
            var course = document.getElementById('paperCourse').value;
            var semester = document.getElementById('paperSemester').value;
            var year = document.getElementById('paperYear').value;
            var file = document.getElementById('paperFile').files[0];

            if (!title || !course || !semester || !year || !file) {
                alert('Please fill all fields and select a PDF file');
                return;
            }

            var formData = new FormData();
            formData.append('action', 'upload');
            formData.append('title', title);
            formData.append('course', course);
            formData.append('semester', semester);
            formData.append('year', year);
            formData.append('paper', file);

            var uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            uploadBtn.disabled = true;

            fetch('includes/manage_papers.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                uploadBtn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload Paper';
                uploadBtn.disabled = false;

                if (data.success) {
                    alert('Question paper uploaded successfully!');
                    document.getElementById('uploadForm').reset();
                    document.getElementById('fileInfo').textContent = '';
                    loadPapers();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                uploadBtn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload Paper';
                uploadBtn.disabled = false;
                alert('Error uploading question paper');
            });
        });

        function loadPapers() {
            fetch('includes/manage_papers.php?action=list')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayPapers(data.papers);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function courseDisplayName(code) {
            var names = { bcom: 'B.Com', bsc: 'B.Sc', bca: 'BCA', bba: 'BBA' };
            return names[code] || (code ? code.toUpperCase() : '');
        }

        function displayPapers(papers) {
            var container = document.getElementById('papersContainer');

            if (papers.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-file-pdf"></i><p>No question papers uploaded</p></div>';
                return;
            }

            var html = '';
            papers.forEach(function(paper) {
                var date = new Date(paper.created_at).toLocaleDateString('en-IN');
                html += '<div class="paper-card">' +
                    '<div class="paper-info">' +
                    '<div class="paper-title"><i class="fa-solid fa-file-pdf"></i> ' + paper.title + '</div>' +
                    '<div class="paper-meta">' + courseDisplayName(paper.course) + ' | Semester ' + paper.semester + ' | ' + paper.year + ' | Uploaded: ' + date + '</div>' +
                    '</div>' +
                    '<div class="paper-actions">' +
                    '<button class="btn-view" onclick="viewPaper(\'' + paper.file_path + '\')"><i class="fa-solid fa-eye"></i> View</button>' +
                    '<button class="btn-delete" onclick="deletePaper(' + paper.id + ')"><i class="fa-solid fa-trash"></i> Delete</button>' +
                    '</div>' +
                    '</div>';
            });

            container.innerHTML = html;
        }

        function viewPaper(filePath) {
            window.open(filePath, '_blank');
        }

        function deletePaper(paperId) {
            if (!confirm('Are you sure you want to delete this question paper?')) {
                return;
            }

            var formData = new FormData();
            formData.append('action', 'delete');
            formData.append('paper_id', paperId);

            fetch('includes/manage_papers.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Question paper deleted successfully');
                    loadPapers();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error deleting question paper');
            });
        }

        function logout() {
            fetch('includes/logout.php', { method: 'POST', keepalive: true });
            localStorage.removeItem('mtcLoggedIn');
            localStorage.removeItem('mtcUserType');
            localStorage.removeItem('mtcUserName');
            localStorage.removeItem('mtcUserEmail');
            localStorage.removeItem('mtcIsAdmin');
            window.location.href = 'stafflogin.html';
        }
    </script>
</body>
</html>

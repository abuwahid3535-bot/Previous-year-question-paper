<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Mother Theresa Degree College</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <!-- College Name -->
        <marquee behavior="scroll"
                 direction="left"
                 scrollamount="10">

            MOTHER THERESA DEGREE COLLEGE

        </marquee>


        <!-- Page Heading -->
        <div class="subtitle">
            Student Registration
        </div>


        <!-- Registration Box -->
        <div class="register-box">

            <form id="registerForm" action="includes/register_student.php" method="POST">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >

                        <i class="fa-solid fa-user"></i>

                    </div>

                    <small id="name-error"></small>

                </div>


                <!-- Student ID -->
                <div class="form-group">

                    <label for="studentId">
                        Student ID / Roll Number
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="studentId"
                            name="studentId"
                            placeholder="Enter student ID"
                            required
                        >

                        <i class="fa-solid fa-id-card"></i>

                    </div>

                    <small id="id-error"></small>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email ID
                    </label>

                    <div class="input-box">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="user@example.com"
                            required
                        >

                        <i class="fa-solid fa-envelope"></i>

                    </div>

                    <small id="email-error"></small>

                </div>


                <!-- Mobile -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <div class="input-box">

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter 10 digit mobile number"
                            maxlength="10"
                            required
                        >

                        <i class="fa-solid fa-phone"></i>

                    </div>

                    <small id="mobile-error"></small>

                </div>


                <!-- Mobile OTP Verification -->
                <div class="form-group">

                    <label for="mobileOtp">
                        Mobile OTP Verification
                    </label>

                    <div class="input-box" style="display:flex; gap:8px;">

                        <input
                            type="text"
                            id="mobileOtp"
                            name="otp"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            style="flex:1;"
                        >

                        <button
                            type="button"
                            id="sendOtpBtn"
                            onclick="sendRegisterOtp()"
                            style="padding:10px 14px; background:#0b4ea2; color:white; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; white-space:nowrap;">

                            Send OTP

                        </button>

                    </div>

                    <small id="mobile-otp-error"></small>

                </div>

                <div id="mobileDemoOtpBox" style="display:none; background:#fff8dc; border:2px dashed #d97706; border-radius:8px; padding:12px; margin-bottom:14px; text-align:center;">
                    <p style="color:#92400e; font-size:13px; font-weight:600; margin-bottom:4px;">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        SMS not available on this account
                    </p>
                    <p style="color:#78350f; font-size:14px; margin:0;">
                        Demo OTP: <strong id="mobileDemoOtp" style="font-size:18px; letter-spacing:3px; color:#b45309;"></strong>
                    </p>
                </div>


                <!-- Course -->
                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" name="course" required>

                        <option value="">
                            Select Course
                        </option>

                        <option value="B.Sc Computer Science">
                            B.Sc Computer Science
                        </option>

                        <option value="B.Sc Data Science">
                            B.Sc Data Science
                        </option>

                        <option value="B.Com">
                            B.Com
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                    </select>

                    <small id="course-error"></small>

                </div>


                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" name="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Commerce">
                            Commerce
                        </option>

                        <option value="Management">
                            Management
                        </option>

                    </select>

                    <small id="department-error"></small>

                </div>


                <!-- Year / Semester -->
                <div class="form-group">

                    <label for="year">
                        Year / Semester
                    </label>

                    <select id="year" name="year" required>

                        <option value="">
                            Select Year / Semester
                        </option>

                        <option value="1st Year - 1st Semester">
                            1st Year - 1st Semester
                        </option>

                        <option value="1st Year - 2nd Semester">
                            1st Year - 2nd Semester
                        </option>

                        <option value="2nd Year - 3rd Semester">
                            2nd Year - 3rd Semester
                        </option>

                        <option value="2nd Year - 4th Semester">
                            2nd Year - 4th Semester
                        </option>

                        <option value="3rd Year - 5th Semester">
                            3rd Year - 5th Semester
                        </option>

                        <option value="3rd Year - 6th Semester">
                            3rd Year - 6th Semester
                        </option>

                    </select>

                    <small id="year-error"></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create password"
                            required
                        >

                        <i class="fa-solid fa-eye-slash"
                           id="togglePassword"></i>

                    </div>

                    <small id="password-error"></small>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                        <i class="fa-solid fa-eye-slash"
                           id="toggleConfirmPassword"></i>

                    </div>

                    <small id="confirm-error"></small>

                </div>


                <!-- Buttons -->
                <div class="bottom-section">

                    <div class="buttons">

                        <!-- Register -->
                        <button
                            type="submit"
                            class="register-btn">

                            Register

                        </button>


                        <!-- Back to Login -->
                        <button
                            type="button"
                            class="login-btn"
                            onclick="window.location.href='form.html'">

                            Back to Login

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        /* GET FORM ELEMENTS */

        const form =
            document.getElementById("registerForm");

        const email =
            document.getElementById("email");

        const mobile =
            document.getElementById("mobile");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");


        /* SEND MOBILE OTP FOR REGISTRATION */

        function sendRegisterOtp() {

            var mobileVal = document.getElementById("mobile").value;
            var otpError = document.getElementById("mobile-otp-error");

            if (!/^[0-9]{10}$/.test(mobileVal)) {
                alert("Please enter a valid 10-digit mobile number first");
                return;
            }

            var btn = document.getElementById("sendOtpBtn");
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;
            otpError.textContent = "";

            fetch('includes/reg_send_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile: mobileVal, type: 'student' })
            })
            .then(response => response.json())
            .then(data => {

                btn.innerHTML = 'Send OTP';
                btn.disabled = false;

                if (data.success) {

                    var demoBox = document.getElementById('mobileDemoOtpBox');

                    if (data.demo_otp) {
                        document.getElementById('mobileDemoOtp').textContent = data.demo_otp;
                        demoBox.style.display = 'block';
                        alert('SMS delivery failed. Use the demo OTP shown for verification.');
                    } else {
                        demoBox.style.display = 'none';
                        alert('OTP sent to +91 ' + mobileVal);
                    }

                } else {
                    otpError.textContent = data.message;
                    otpError.style.color = 'red';
                }

            })
            .catch(error => {
                console.error('Error:', error);
                btn.innerHTML = 'Send OTP';
                btn.disabled = false;
                alert('Error sending OTP. Please try again.');
            });

        }

        /* /SEND MOBILE OTP FOR REGISTRATION */


        /* EMAIL VALIDATION */

        email.addEventListener("input", function () {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const error =
                document.getElementById("email-error");


            if (email.value === "") {

                error.textContent =
                    "Please enter your email";

                error.style.color = "#d8e5ff";

            }

            else if (!emailPattern.test(email.value)) {

                error.textContent =
                    "Please enter a valid email ID";

                error.style.color = "red";

            }

            else {

                error.textContent =
                    "Valid email";

                error.style.color = "lightgreen";

            }

        });


        /* MOBILE VALIDATION */

        mobile.addEventListener("input", function () {

            const mobilePattern =
                /^[0-9]{10}$/;

            const error =
                document.getElementById("mobile-error");


            if (!mobilePattern.test(mobile.value)) {

                error.textContent =
                    "Enter a valid 10 digit mobile number";

                error.style.color = "red";

            }

            else {

                error.textContent =
                    "Valid mobile number";

                error.style.color = "lightgreen";

            }

        });


        /* PASSWORD VALIDATION */

        password.addEventListener("input", function () {

            const error =
                document.getElementById("password-error");


            if (password.value.length < 6) {

                error.textContent =
                    "Password must contain at least 6 characters";

                error.style.color = "red";

            }

            else {

                error.textContent =
                    "Strong password";

                error.style.color = "lightgreen";

            }

        });


        /* CONFIRM PASSWORD VALIDATION */

        confirmPassword.addEventListener("input", function () {

            const error =
                document.getElementById("confirm-error");


            if (confirmPassword.value !== password.value) {

                error.textContent =
                    "Passwords do not match";

                error.style.color = "red";

            }

            else {

                error.textContent =
                    "Passwords match";

                error.style.color = "lightgreen";

            }

        });


        /* FORM SUBMISSION */

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const mobilePattern =
                /^[0-9]{10}$/;


            /* EMAIL CHECK */

            if (!emailPattern.test(email.value)) {

                alert("Please enter a valid email ID");

                return;

            }


            /* MOBILE CHECK */

            if (!mobilePattern.test(mobile.value)) {

                alert("Please enter a valid mobile number");

                return;

            }


            /* PASSWORD CHECK */

            if (password.value.length < 6) {

                alert(
                    "Password must contain at least 6 characters"
                );

                return;

            }


            /* CONFIRM PASSWORD CHECK */

            if (password.value !== confirmPassword.value) {

                alert("Passwords do not match");

                return;

            }


            /* OTP CHECK */

            var otpVal = document.getElementById("mobileOtp").value;

            if (otpVal.length !== 6) {

                alert("Please verify your mobile number with the OTP first");

                return;

            }


            /* Submit to PHP backend */

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Registering...";
            submitBtn.disabled = true;

            const formData = new FormData(form);

            fetch('includes/register_student.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {

                if (data.success) {

                    alert("Registration successful! You can now login.");
                    window.location.href = 'form.html';

                } else {

                    alert(data.message || "Registration failed");
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;

                }

            })
            .catch(error => {

                console.error('Error:', error);
                alert("An error occurred. Please try again.");
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;

            });

        });


        /* SHOW / HIDE PASSWORD */

        document
            .getElementById("togglePassword")
            .addEventListener("click", function () {

                if (password.type === "password") {

                    password.type = "text";

                    this.classList.remove(
                        "fa-eye-slash"
                    );

                    this.classList.add(
                        "fa-eye"
                    );

                }

                else {

                    password.type = "password";

                    this.classList.remove(
                        "fa-eye"
                    );

                    this.classList.add(
                        "fa-eye-slash"
                    );

                }

            });


        /* SHOW / HIDE CONFIRM PASSWORD */

        document
            .getElementById("toggleConfirmPassword")
            .addEventListener("click", function () {

                if (confirmPassword.type === "password") {

                    confirmPassword.type = "text";

                    this.classList.remove(
                        "fa-eye-slash"
                    );

                    this.classList.add(
                        "fa-eye"
                    );

                }

                else {

                    confirmPassword.type = "password";

                    this.classList.remove(
                        "fa-eye"
                    );

                    this.classList.add(
                        "fa-eye-slash"
                    );

                }

            });

    </script>

</body>

</html>

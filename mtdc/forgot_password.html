<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother Theresa Degree College - Forgot Password</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- College Name -->
        <marquee behavior="scroll" direction="left" scrollamount="10">
            MOTHER THERESA DEGREE COLLEGE
        </marquee>

        <!-- Title -->
        <div class="subtitle">
            Forgot Password
        </div>

        <!-- Form Box -->
        <div class="login-box">

            <!-- STEP 1: Enter Mobile Number -->
            <form id="step1Form">

                <div style="text-align:center; margin-bottom:20px;">
                    <i class="fa-solid fa-mobile-screen-button" style="font-size:40px; color:#0b4ea2;"></i>
                    <p style="margin-top:10px; color:#666;">
                        Enter your registered mobile number to receive OTP
                    </p>
                </div>

                <!-- Mobile Input -->
                <div class="form-group">
                    <label for="resetMobile">Registered Mobile Number</label>
                    <div class="input-box">
                        <input type="text" id="resetMobile" name="mobile" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <small id="mobile-error"></small>
                </div>

                <!-- Buttons -->
                <div class="bottom-section">
                    <div class="links">
                        <a href="form.html">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back to Login
                        </a>
                    </div>
                    <div class="buttons">
                        <button type="submit" class="login-btn">
                            <i class="fa-solid fa-paper-plane"></i>
                            Send OTP
                        </button>
                    </div>
                </div>

            </form>

            <!-- STEP 2: Enter OTP (hidden initially) -->
            <form id="step2Form" style="display:none;">

                <div style="text-align:center; margin-bottom:20px;">
                    <i class="fa-solid fa-shield-halved" style="font-size:40px; color:#0b4ea2;"></i>
                    <p style="margin-top:10px; color:#666;">
                        OTP sent to <strong id="otpMobile"></strong>
                    </p>
                </div>

                <!-- Demo OTP Box (shown when SMS cannot be delivered) -->
                <div id="demoOtpBox" style="display:none; background:#fff8dc; border:2px dashed #d97706; border-radius:8px; padding:12px; margin-bottom:14px; text-align:center;">
                    <p style="color:#92400e; font-size:13px; font-weight:600; margin-bottom:4px;">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        SMS not available on this account
                    </p>
                    <p style="color:#78350f; font-size:14px; margin:0;">
                        Demo OTP: <strong id="demoOtp" style="font-size:18px; letter-spacing:3px; color:#b45309;"></strong>
                    </p>
                </div>

                <!-- OTP Input -->
                <div class="form-group">
                    <label for="otpInput">Enter 6-digit OTP</label>
                    <div class="input-box">
                        <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" required>
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <small id="otp-error"></small>
                </div>

                <!-- Resend OTP Section -->
                <div class="form-group" style="text-align:center; margin-top:15px;">
                    <span id="resendTimer" style="color:#666; font-size:14px;">
                        Resend OTP in <strong id="countdown">30</strong> seconds
                    </span>
                    <br>
                    <button type="button" id="resendBtn" onclick="resendOTP()" style="
                        display:none;
                        margin-top:10px;
                        padding:10px 20px;
                        background:#0b4ea2;
                        color:white;
                        border:none;
                        border-radius:5px;
                        cursor:pointer;
                        font-size:14px;
                        font-weight:600;
                    ">
                        <i class="fa-solid fa-rotate-right"></i>
                        Resend OTP
                    </button>
                </div>

                <!-- Buttons -->
                <div class="bottom-section" style="margin-top:20px;">
                    <div class="links">
                        <a href="#" onclick="goToStep1()">
                            <i class="fa-solid fa-arrow-left"></i>
                            Change Mobile
                        </a>
                    </div>
                    <div class="buttons">
                        <button type="submit" class="login-btn" id="verifyBtn">
                            <i class="fa-solid fa-check"></i>
                            Verify OTP
                        </button>
                    </div>
                </div>

            </form>

            <!-- STEP 3: Set New Password (hidden initially) -->
            <form id="step3Form" style="display:none;">

                <div style="text-align:center; margin-bottom:20px;">
                    <i class="fa-solid fa-key" style="font-size:40px; color:#28a745;"></i>
                    <p style="margin-top:10px; color:#666;">
                        OTP Verified! Set your new password
                    </p>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-box">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <i class="fa-solid fa-eye-slash" id="toggleNewPassword"></i>
                    </div>
                    <small id="newpass-error"></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-box">
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                        <i class="fa-solid fa-eye-slash" id="toggleConfirmPassword"></i>
                    </div>
                    <small id="confirmpass-error"></small>
                </div>

                <!-- Buttons -->
                <div class="bottom-section">
                    <div class="links">
                        <a href="form.html">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back to Login
                        </a>
                    </div>
                    <div class="buttons">
                        <button type="submit" class="login-btn" style="background:#28a745;">
                            <i class="fa-solid fa-check"></i>
                            Reset Password
                        </button>
                    </div>
                </div>

            </form>

        </div>

    </div>

    <!-- JavaScript -->
    <script>

        var resetMobile = '';
        var timerInterval;
        var countdown = 30;


        /* START COUNTDOWN TIMER */
        function startTimer() {
            countdown = 30;
            document.getElementById('resendBtn').style.display = 'none';
            document.getElementById('resendTimer').style.display = 'block';
            document.getElementById('countdown').textContent = countdown;

            timerInterval = setInterval(function() {
                countdown--;
                document.getElementById('countdown').textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('resendBtn').style.display = 'inline-block';
                    document.getElementById('resendTimer').style.display = 'none';
                }
            }, 1000);
        }


        /* RESEND OTP */
        function resendOTP() {

            if (!resetMobile) {
                alert('Session expired. Please start over.');
                goToStep1();
                return;
            }

            var resendBtn = document.getElementById('resendBtn');
            resendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            resendBtn.disabled = true;

            fetch('includes/forgot_password_send_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile: resetMobile })
            })
            .then(response => response.json())
            .then(data => {

                resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Resend OTP';
                resendBtn.disabled = false;

                if (data.success) {
                    var demoBox = document.getElementById('demoOtpBox');

                    if (data.demo_otp) {
                        document.getElementById('demoOtp').textContent = data.demo_otp;
                        demoBox.style.display = 'block';
                        alert('SMS delivery failed. Use the demo OTP shown on screen to continue.');
                    } else {
                        demoBox.style.display = 'none';
                        alert('New OTP sent to +91 ' + resetMobile);
                    }

                    startTimer();
                } else {
                    alert('Failed to resend OTP: ' + data.message);
                }

            })
            .catch(error => {

                console.error('Error:', error);
                resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Resend OTP';
                resendBtn.disabled = false;
                alert('Error sending OTP. Please try again.');

            });

        }


        /* STEP 1: Send OTP to mobile */
        document.getElementById('step1Form').addEventListener('submit', function(e) {
            e.preventDefault();

            resetMobile = document.getElementById('resetMobile').value;
            var mobileError = document.getElementById('mobile-error');

            /* Validate mobile */
            var mobilePattern = /^[0-9]{10}$/;
            if (!mobilePattern.test(resetMobile)) {
                mobileError.textContent = 'Please enter a valid 10-digit mobile number';
                mobileError.style.color = 'red';
                return;
            }

            mobileError.textContent = '';
            var submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending OTP...';
            submitBtn.disabled = true;

            /* Send request to server */
            fetch('includes/forgot_password_send_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile: resetMobile })
            })
            .then(response => response.json())
            .then(data => {

                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP';
                submitBtn.disabled = false;

                if (data.success) {
                    document.getElementById('otpMobile').textContent = '+91 ' + resetMobile;
                    document.getElementById('step1Form').style.display = 'none';
                    document.getElementById('step2Form').style.display = 'block';

                    var demoBox = document.getElementById('demoOtpBox');

                    if (data.demo_otp) {
                        document.getElementById('demoOtp').textContent = data.demo_otp;
                        demoBox.style.display = 'block';
                        alert('SMS delivery failed. Use the demo OTP shown on screen to continue.');
                    } else {
                        demoBox.style.display = 'none';
                        alert('OTP sent to your mobile number via SMS');
                    }

                    startTimer();
                } else {
                    mobileError.textContent = data.message;
                    mobileError.style.color = 'red';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending OTP');
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP';
                submitBtn.disabled = false;
            });

        });


        /* STEP 2: Verify OTP */
        document.getElementById('step2Form').addEventListener('submit', function(e) {
            e.preventDefault();

            var enteredOtp = document.getElementById('otpInput').value;
            var otpError = document.getElementById('otp-error');

            if (enteredOtp.length !== 6) {
                otpError.textContent = 'Please enter a valid 6-digit OTP';
                otpError.style.color = 'red';
                return;
            }

            var submitBtn = document.getElementById('verifyBtn');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            submitBtn.disabled = true;

            fetch('includes/forgot_password_verify_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile: resetMobile, otp: enteredOtp })
            })
            .then(response => response.json())
            .then(data => {

                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Verify OTP';
                submitBtn.disabled = false;

                if (data.success) {
                    clearInterval(timerInterval);
                    document.getElementById('step2Form').style.display = 'none';
                    document.getElementById('step3Form').style.display = 'block';
                } else {
                    otpError.textContent = data.message;
                    otpError.style.color = 'red';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error verifying OTP');
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Verify OTP';
                submitBtn.disabled = false;
            });

        });


        /* STEP 3: Reset Password */
        document.getElementById('step3Form').addEventListener('submit', function(e) {
            e.preventDefault();

            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var newpassError = document.getElementById('newpass-error');
            var confirmpassError = document.getElementById('confirmpass-error');

            newpassError.textContent = '';
            confirmpassError.textContent = '';

            /* Validate password */
            if (newPassword.length < 6) {
                newpassError.textContent = 'Password must be at least 6 characters';
                newpassError.style.color = 'red';
                return;
            }

            /* Validate confirm password */
            if (newPassword !== confirmPassword) {
                confirmpassError.textContent = 'Passwords do not match';
                confirmpassError.style.color = 'red';
                return;
            }

            var submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';
            submitBtn.disabled = true;

            /* Reset password */
            fetch('includes/forgot_password_reset.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile: resetMobile, password: newPassword })
            })
            .then(response => response.json())
            .then(data => {

                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Reset Password';
                submitBtn.disabled = false;

                if (data.success) {
                    alert('Password reset successful! You can now login with your new password.');
                    window.location.href = 'form.html';
                } else {
                    newpassError.textContent = data.message;
                    newpassError.style.color = 'red';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error resetting password');
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Reset Password';
                submitBtn.disabled = false;
            });

        });


        /* Go back to Step 1 */
        function goToStep1() {
            clearInterval(timerInterval);
            document.getElementById('step1Form').style.display = 'block';
            document.getElementById('step2Form').style.display = 'none';
            document.getElementById('step3Form').style.display = 'none';
        }


        /* Show/Hide Password */
        document.getElementById('toggleNewPassword').addEventListener('click', function() {
            var pw = document.getElementById('newPassword');
            pw.type = pw.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            var pw = document.getElementById('confirmPassword');
            pw.type = pw.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });

    </script>

</body>
</html>
